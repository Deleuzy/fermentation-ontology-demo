# How each CSV column maps to ontology terms, and what was checked.
# status:
#   reused  : an existing community term covers it and is used as is
#   new     : no existing term fitted; a FERM term was minted (proposal below)
#   local   : a local identifier or free text, needs no term
# PREFER (release 2026-08-24) was checked first, then OBI, IAO, UO and others
# in OLS. "checked" lists terms that were considered and why they were or
# were not used. All CURIEs here are in ontology/external_terms.json.
columns:
  run_id:
    status: reused
    maps_to: [PREFER:0000004]
    checked:
      - curie: GO:0006113
        why_not: GO fermentation is the metabolic process in the cell, not a planned production run.
  mode:
    status: reused
    maps_to: [PREFER:0000181, PREFER:0000182]
    checked:
      - curie: PREFER:8000018
        why_not: PREFER attaches the operation mode to the bioreactor. Here one bioreactor runs in both modes on different runs, so the mode datum is about the run instead.
      - curie: MSIO:0000181
        why_not: MSIO batch cell culture is a cultured cell population, not a mode.
  strain_id:
    status: reused
    maps_to: [PREFER:0000012]
    note: The strain is typed as a PREFER cell biocatalyst and also with its NCBITaxon species class. PREFER models taxon as a quality (PREFER:0000013) with only a few species so far, so NCBITaxon typing is kept.
  ncbi_taxon:
    status: reused
    maps_to: [NCBITaxon:4932, NCBITaxon:562, NCBITaxon:460519, NCBITaxon:1423, NCBITaxon:51453]
  organism_name:
    status: local
    maps_to: []
    note: Free text, kept in the CSV for people. The label comes from NCBITaxon instead.
  target_product:
    status: new
    maps_to: [FERM:0000005]
    checked:
      - curie: PREFER:8000017
        why_not: PREFER has measured compound links a run to a chemical entity that is measured. It does not say the entity is the intended product.
      - curie: PREFER:0000107
        why_not: Compound formed variable is a balance metric (how much of a compound was formed), an information entity, not the product itself.
      - curie: PREFER:0000203
        why_not: Production culture is a role of the culture that makes the product, not of the product.
    proposed:
      label: target product
      parent: BFO:0000040 material entity
      note: PREFER issue 70 (bioprocess products classification) is open and covers this area, so this gap may close there. Each product should also point to a Protein Ontology (PR) term, not done because the PR IRIs were not checked.
  medium_id:
    status: reused
    maps_to: [PREFER:0000011]
    checked:
      - curie: OBI:0000079
        why_not: OBI culture medium also fits. PREFER fermentation medium is used because it is the domain standard and has the medium ingredient relation.
  carbon_source:
    status: new
    maps_to: [FERM:0000101, CHEBI:17234, CHEBI:17754, CHEBI:17790, CHEBI:17992]
    checked:
      - curie: PREFER:8000004
        why_not: Used as the parent. PREFER has medium ingredient does not say which ingredient is the carbon source.
      - curie: PREFER:0000108
        why_not: Fermentation medium role (batch, feed and seed medium) is where PREFER keeps medium roles. A carbon source role for an ingredient, placed next to it under BFO role, would be the cleaner model than a new relation.
    proposed:
      label: has carbon source
      parent: PREFER:8000004 has medium ingredient
      note: The chemicals are reused from ChEBI; only the relation is new. A carbon source role on the ingredient, beside PREFER:0000108 fermentation medium role, would be the cleaner model.
  bioreactor_id:
    status: reused
    maps_to: [PREFER:0000014]
    checked:
      - curie: OBI:0001046
        why_not: OBI bioreactor also exists. PREFER bioreactor is used because PREFER runs link to it with uses bioreactor.
  working_volume_L:
    status: reused
    maps_to: [PREFER:0000036, UO:0000099]
    checked:
      - curie: PREFER:0000043
        why_not: Volume measured process variable is the volume at any time point; the CSV holds the starting volume, which is PREFER initial culture volume. PREFER issue 197 (working against total volume) is related.
  temperature_C:
    status: reused
    maps_to: [PREFER:0000041, UO:0000027]
    checked:
      - curie: NCIT:C210081
        why_not: Close, but NCIT is not aligned to BFO and PREFER has a direct term.
  pH:
    status: reused
    maps_to: [PREFER:0000040, UO:0000196]
    checked:
      - curie: PREFER:0000038
        why_not: Batch medium pH is the pH of the medium, not of the culture during the run.
  duration_h:
    status: new
    maps_to: [FERM:0000013, UO:0000032]
    checked:
      - curie: PREFER:0000016
        why_not: Fermentation phase is a process (batch, feed, growth, production phase). It has no variable for how long the whole run lasted.
      - curie: PREFER:8000059
        why_not: Measured at time datum time stamps a single measurement; it does not give the run duration.
    proposed:
      label: run duration datum
      parent: IAO:0000032 scalar measurement datum
      note: No PREFER variable for total run time (inoculation to harvest) was found in the 2026-08-24 release. It may fit as a PREFER calculated process variable.
  titre_g_per_L:
    status: reused
    maps_to: [PREFER:0000091, UO:0000175]
    checked:
      - curie: PREFER:0000074
        why_not: Compound concentration variable is for a sample withdrawn during the run; the CSV holds the final titre, which matches titer process metric.
      - curie: UO:0010080
        why_not: UO titer is a dilution based unit, not a mass concentration.
