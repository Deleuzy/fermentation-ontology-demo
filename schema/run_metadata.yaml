id: https://github.com/Deleuzy/fermentation-ontology-demo/schema/run_metadata
name: run_metadata
title: Fermentation run metadata template
description: >-
  One row per fermentation run, as in data/runs.csv. Required slots are the
  minimum needed to map a run to the FERM ontology. Titre, duration and
  working volume are recommended. Learning demo, not a community standard.
license: https://creativecommons.org/licenses/by/4.0/
version: "2026-11-12"
prefixes:
  linkml: https://w3id.org/linkml/
  obo: http://purl.obolibrary.org/obo/
  ferm: https://github.com/Deleuzy/fermentation-ontology-demo/FERM_
  run_metadata: https://github.com/Deleuzy/fermentation-ontology-demo/schema/run_metadata/
default_prefix: run_metadata
default_range: string
imports:
  - linkml:types

classes:
  FermentationRun:
    description: Metadata for one fermentation run.
    class_uri: ferm:0000001
    slots:
      - run_id
      - strain_id
      - ncbi_taxon
      - organism_name
      - target_product
      - mode
      - medium_id
      - carbon_source
      - bioreactor_id
      - working_volume_L
      - temperature_C
      - pH
      - duration_h
      - titre_g_per_L
  RunCollection:
    description: Container used to validate a whole CSV file at once.
    tree_root: true
    attributes:
      runs:
        description: All runs in one CSV file.
        range: FermentationRun
        multivalued: true
        inlined_as_list: true

slots:
  run_id:
    description: Run identifier, unique within the file.
    identifier: true
    required: true
    pattern: "^[A-Z][0-9]{2}$"
  strain_id:
    description: Local identifier of the production strain.
    required: true
  ncbi_taxon:
    description: NCBITaxon CURIE of the strain's species.
    required: true
    pattern: "^NCBITaxon:[0-9]+$"
  organism_name:
    description: Free text organism name, kept for humans. The taxon is the identifier.
    recommended: true
  target_product:
    description: Name of the product the run is meant to make.
    required: true
  mode:
    description: Batch or fed-batch.
    required: true
    range: RunMode
  medium_id:
    description: Local identifier of the culture medium.
    required: true
  carbon_source:
    description: Main carbon source in the medium.
    required: true
    range: CarbonSource
  bioreactor_id:
    description: Local identifier of the bioreactor.
    required: true
  working_volume_L:
    description: Starting working volume in liters.
    range: float
    minimum_value: 0
    recommended: true
    unit:
      ucum_code: L
  temperature_C:
    description: Mean culture temperature in degrees Celsius.
    range: float
    required: true
    minimum_value: 4
    maximum_value: 80
    unit:
      ucum_code: Cel
  pH:
    description: Mean culture pH.
    range: float
    required: true
    minimum_value: 0
    maximum_value: 14
    unit:
      ucum_code: "[pH]"
  duration_h:
    description: Time from inoculation to harvest in hours.
    range: float
    minimum_value: 0
    recommended: true
    unit:
      ucum_code: h
  titre_g_per_L:
    description: Final product titre in gram per liter.
    range: float
    minimum_value: 0
    recommended: true
    unit:
      ucum_code: g/L

enums:
  RunMode:
    description: How nutrients are supplied during the run.
    permissible_values:
      batch:
        meaning: ferm:0000002
      fed-batch:
        meaning: ferm:0000003
  CarbonSource:
    description: Main carbon source in the medium, mapped to ChEBI.
    permissible_values:
      glucose:
        meaning: obo:CHEBI_17234
      glycerol:
        meaning: obo:CHEBI_17754
      methanol:
        meaning: obo:CHEBI_17790
      sucrose:
        meaning: obo:CHEBI_17992
