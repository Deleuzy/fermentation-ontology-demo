name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ROBOT_VERSION: v1.9.11
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pipeline (results and README must be current)
        run: |
          uv run python -m ferm_demo.pipeline --check
          git diff --exit-code results/ README.md

      - name: Tests (HermiT test runs here because Java is present)
        run: uv run pytest -v

      - name: ROBOT reason and report
        run: |
          curl -sSL -o robot.jar "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          robot() { java -jar robot.jar "$@"; }
          robot reason --reasoner HermiT --input ontology/ferm.ttl --output build/ferm-reasoned.owl
          robot merge --input ontology/ferm.ttl --input build/instances.ttl \
            reason --reasoner HermiT --output build/ferm-with-data-reasoned.owl
          robot report --input ontology/ferm.ttl --fail-on ERROR --output build/robot_report.tsv
          echo "ROBOT report rows by level:"
          tail -n +2 build/robot_report.tsv | cut -f1 | sort | uniq -c

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
